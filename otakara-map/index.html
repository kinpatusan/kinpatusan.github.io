<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お宝マップ — Support</title>
<link rel="alternate" hreflang="ja" href="https://kinpatusan.github.io/otakara-map/ja/support.html">
<link rel="alternate" hreflang="en" href="https://kinpatusan.github.io/otakara-map/en/support.html">
<link rel="alternate" hreflang="zh-Hans" href="https://kinpatusan.github.io/otakara-map/zh-Hans/support.html">
<link rel="alternate" hreflang="zh-Hant" href="https://kinpatusan.github.io/otakara-map/zh-Hant/support.html">
<link rel="alternate" hreflang="ko" href="https://kinpatusan.github.io/otakara-map/ko/support.html">
<link rel="alternate" hreflang="es" href="https://kinpatusan.github.io/otakara-map/es/support.html">
<link rel="alternate" hreflang="fr" href="https://kinpatusan.github.io/otakara-map/fr/support.html">
<link rel="alternate" hreflang="de" href="https://kinpatusan.github.io/otakara-map/de/support.html">
<link rel="alternate" hreflang="it" href="https://kinpatusan.github.io/otakara-map/it/support.html">
<link rel="alternate" hreflang="pt-BR" href="https://kinpatusan.github.io/otakara-map/pt-BR/support.html">
<style>
:root{
  --gold:#c8a34a; --gold-soft:#e6d3a3;
  --ink:#1b1b1f; --sub:#6b6b73; --line:#e6e6ea;
  --bg:#fbfaf7; --card:#fff; --accent:#7c6bd6;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#ececf1; --sub:#a0a0a8; --line:#33333a;
         --bg:#141416; --card:#1d1d21; --gold:#d9b968; --gold-soft:#e6d3a3; }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",
    "Segoe UI",system-ui,sans-serif;
  line-height:1.85; -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 72px}
header.site{
  background:linear-gradient(160deg,#2b2620 0%,#3d3527 55%,#241f1a 100%);
  color:#fff; padding:34px 0 30px; margin-bottom:34px;
}
header.site .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark{
  width:52px;height:52px;border-radius:13px;flex:none;display:block;
  box-shadow:0 3px 12px rgba(0,0,0,.4);
}
.brand h1{font-size:1.28rem;margin:0;letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--gold-soft);font-size:.85rem}
nav.site{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
nav.site a{
  color:#fff;text-decoration:none;font-size:.86rem;
  padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
}
nav.site a.on{background:var(--gold);border-color:var(--gold);color:#241f1a;font-weight:700}
h2{
  font-size:1.06rem;margin:2.4rem 0 .8rem;padding-left:.65rem;
  border-left:4px solid var(--gold);line-height:1.5;
}
p{margin:.7rem 0}
.lead{color:var(--sub);font-size:.97rem}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:4px 20px;margin:1rem 0;
}
ul{padding-left:1.2rem;margin:.6rem 0}
li{margin:.35rem 0}
a{color:#8a6fd8}
.faq dt{font-weight:700;margin-top:1.3rem}
.faq dd{margin:.3rem 0 0;color:var(--sub)}
.mail{
  display:inline-block;margin:.3rem 0 .6rem;padding:11px 18px;border-radius:10px;
  background:var(--gold);color:#241f1a;font-weight:700;text-decoration:none;
}
.langs{margin-top:2.6rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.langs .label{color:var(--sub);font-size:.8rem;margin-bottom:.5rem}
.langs a{
  display:inline-block;margin:0 .45rem .5rem 0;padding:5px 12px;
  border:1px solid var(--line);border-radius:999px;font-size:.84rem;
  text-decoration:none;color:var(--ink);background:var(--card);
}
.langs a.on{border-color:var(--gold);color:var(--gold);font-weight:700}
footer.site{color:var(--sub);font-size:.8rem;margin-top:2.4rem;
  padding-top:1.2rem;border-top:1px solid var(--line)}
.hub{max-width:520px;margin:12vh auto;text-align:center;padding:0 20px}
.hub .langs{border:0}
</style>
<script>
(function(){
  var supported = ["ja", "en", "zh-Hans", "zh-Hant", "ko", "es", "fr", "de", "it", "pt-BR"];
  var want = (navigator.languages || [navigator.language || "en"]);
  for (var i = 0; i < want.length; i++) {
    var w = want[i];
    for (var j = 0; j < supported.length; j++) {
      if (w === supported[j] || w.split("-")[0] === supported[j].split("-")[0]) {
        location.replace("./" + supported[j] + "/support.html"); return;
      }
    }
  }
  location.replace("./en/support.html");
})();
</script>
</head>
<body>
<div class="hub">
  <div class="brand" style="justify-content:center">
    <img class="mark" src="./icon.png" alt="" width="52" height="52">
    <div style="text-align:left">
      <h1 style="font-size:1.2rem;margin:0">お宝マップ</h1>
      <p style="margin:2px 0 0;color:var(--sub);font-size:.85rem">Support</p>
    </div>
  </div>
  <div class="langs"><div class="label">Language / 言語</div><a href="./ja/support.html">日本語</a><a href="./en/support.html">English</a><a href="./zh-Hans/support.html">简体中文</a><a href="./zh-Hant/support.html">繁體中文</a><a href="./ko/support.html">한국어</a><a href="./es/support.html">Español</a><a href="./fr/support.html">Français</a><a href="./de/support.html">Deutsch</a><a href="./it/support.html">Italiano</a><a href="./pt-BR/support.html">Português</a></div>
</div>
</body>
</html>
